site_name: Wiki GwaIO
# repo_name: "ToDo"
# repo_url: ToDo
# site_url: ToDo
site_description: GwaIO Pipeline 3D tool Documentation
site_author: Emanuel Aguado Pérez
copyright: Copyright &copy; 2025 Mondo TV Studios
    

theme:
  name: material
  custom_dir: material/overrides
  logo: assets/logos/gwaio-favicon.ico
  favicon: assets/logos/gwaio-favicon.ico
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Tema oscuro
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate 
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.instant.preview
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.blocks.caption
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - material/overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
  status:
    new: Recently added
    deprecated: Deprecated
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  social:
    - icon: fontawesome/brands/github
      link: https://mondotvstudios.com/
    - icon: fontawesome/brands/docker
      link: https://mondotvstudios.com/
    - icon: fontawesome/brands/python
      link: https://mondotvstudios.com/
    - icon: fontawesome/brands/x-twitter
      link: https://mondotvstudios.com/

extra_css:
  - css/banner.css
  - css/chat.css
  - css/extra.css
  - css/gwaio.css
  - css/mkdocstrings.css

extra_javascript:
  - js/chat.js
  # - js/auth.js


plugins:
  - search
  - drawio
  - glightbox
  - mkdocs-video:
      is_video: True
      video_autoplay: False
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          load_external_modules: false
          options:
            allow_inspection: false
            filters:
              - "!^_[^_]"
            backlinks: False
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            filters: public
            # heading_level: 1
            inherited_members: true
            line_length: 88
            merge_init_into_class: true
            parameter_headings: true
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_inheritance_diagram: true
            inheritance_diagram_direction: LR
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_submodules: true
            signature_crossrefs: true
            summary: true
            unwrap_annotated: true
          paths:
            - ..
  - awesome-nav
  - gen-files:
      scripts:
        - scripts/code_to_md.py
